name: Churn API CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-test.txt

      - name: Install test dependencies
        run: |
          python -m pip install -r requirements-test.txt
          python -m pip check

      - name: Run API integration tests
        run: python -m pytest tests/test_api.py -q

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build and start API
        run: docker compose up --build --wait --wait-timeout 120

      - name: Verify container health and prediction
        run: |
          python - <<'PY'
          import json
          import math
          import urllib.request
          from pathlib import Path

          import pandas as pd

          from src.predict import load_artifacts, score_customers

          base_url = "http://127.0.0.1:8000"

          with urllib.request.urlopen(
              f"{base_url}/health", timeout=30
          ) as response:
              health = json.load(response)

          assert health["status"] == "ok", health

          payload = json.loads(
              Path("examples/request.json").read_text(
                  encoding="utf-8-sig"
              )
          )

          request = urllib.request.Request(
              f"{base_url}/predict",
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST",
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              actual = json.load(response)["predictions"]

          model, metadata = load_artifacts(Path("artifacts"))
          expected = score_customers(
              pd.DataFrame(payload["customers"]),
              model,
              metadata,
          ).to_dict(orient="records")

          assert health["model"] == metadata["model"]
          assert len(actual) == len(expected)

          for received, reference in zip(actual, expected):
              assert received["customer_id"] == reference["customer_id"]
              assert received["risk_band"] == reference["risk_band"]
              assert math.isclose(
                  received["p_churn"],
                  reference["p_churn"],
                  rel_tol=1e-9,
                  abs_tol=1e-9,
              )

          print("Container health and prediction checks passed.")
          PY

      - name: Publish tested release image
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          VERSION="${GITHUB_REF_NAME}"

          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH, for example v1.0.0"
            exit 1
          fi

          printf '%s' "$GHCR_TOKEN" |
            docker login ghcr.io \
              --username "$GITHUB_ACTOR" \
              --password-stdin

          trap 'docker logout ghcr.io' EXIT

          docker tag kenya-bank-customer-churn:local "$IMAGE:$VERSION"
          docker tag kenya-bank-customer-churn:local "$IMAGE:sha-$GITHUB_SHA"

          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:sha-$GITHUB_SHA"

          echo "### Published release image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$IMAGE:$VERSION\`" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$IMAGE:sha-$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 100

      - name: Stop containers
        if: always()
        run: docker compose down